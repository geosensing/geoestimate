[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "geoestimate"
version = "0.1.1"
description = "Design-aware estimation for equal-probability observation samples"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Gaurav Sood", email = "gsood07@gmail.com"},
]
keywords = [
    "spatial-statistics", "survey-inference", "design-based",
    "cluster-robust", "geosensing", "street-survey",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=3.0.5",
    # pandas.read_parquet needs an engine; pyarrow is the one it prefers.
    "pyarrow>=15",
    "scipy>=1.10.0",
]

[project.scripts]
geoestimate = "geoestimate.io:main"

[project.urls]
Homepage = "https://github.com/geosensing/geoestimate"
Repository = "https://github.com/geosensing/geoestimate"
Documentation = "https://geosensing.github.io/geoestimate/"
Issues = "https://github.com/geosensing/geoestimate/issues"

[project.optional-dependencies]
# The real geo_sampling to allocator pipeline, used by geoestimate.pipeline and the
# validation example. Imported lazily; core geoestimate needs none of it.
pipeline = ["allocator", "geo-sampling"]

[tool.uv.build-backend]
module-name = "geoestimate"
module-root = "src"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'

[dependency-groups]
dev = ["ruff>=0.16.2", "pandas-stubs", "scipy-stubs", "pyright>=1.1.390", "pydoclint>=0.5", "pytest>=8"]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=4.1.0",
    # A git reference, so it stays in dependency-groups and out of the published
    # extras: PyPI rejects direct URL references in project metadata.
    "simcheck @ git+https://github.com/finite-sample/simcheck",
]
docs = [
    "sphinx>=7.0",
    "furo",
    "myst-parser>=2.0",
    "linkify-it-py>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.5",
    "soupsieve>=2.9.0",
    "py-canon @ git+https://github.com/gojiplus/py-canon@v1.3.0",
]

[tool.pytest.ini_options]
minversion = "8"
testpaths = ["tests"]
log_level = "INFO"
xfail_strict = true
filterwarnings = ["error"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.coverage.run]
source = ["src"]

[tool.preen]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
external = ["DOC"]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF",
    "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY",
    "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF",
]
# D203/D213: the google convention the fleet standard picks. W191/D206/D300:
# ruff's own docs list these as always incompatible with `ruff format`, which
# the standard also runs.
ignore = ["D203", "D213", "W191", "D206", "D300"]

# The codebase writes grid dimensions and rates as "100 x 100" with the
# multiplication sign, which is what the notation means.
allowed-confusables = ["×"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ARG", "SLF"]
"docs/**" = ["D"]
# `geoestimate.io`'s CLI prints its result; that output is the interface.
"src/geoestimate/io.py" = ["T201"]
# `python -m geoestimate.simulate` prints its experiment tables.
"src/geoestimate/simulate.py" = ["T201"]
# Worked examples print their results; that output is the point of them.
"examples/**" = ["T201", "D"]
